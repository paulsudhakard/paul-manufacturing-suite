[project]
name = "pms-core"
version = "0.1.0"
description = "PMS Core — product-blind manufacturing automation platform (Architecture v3 / TDD v1)"
requires-python = ">=3.12"
readme = "README.md"
# Runtime deps are added when the sprint that needs them actually adds
# them — not speculatively ahead of need.
dependencies = [
    "pyyaml==6.0.2",  # config.yaml loading (TDD §20/§24)
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "black==24.10.0",
    "ruff==0.8.4",
    "mypy==1.13.0",
    "requests==2.32.3",  # reference Adapter client (adapters/coreldraw/reference_client) + its tests
]

[project.scripts]
pms-core = "core.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*"]
exclude = ["core.tests*"]

[tool.setuptools.package-data]
"core.engines.manufacturing.config" = ["*.yaml"]

# --- Linting / formatting -------------------------------------------------

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["products"]  # data/config only, not Python

[tool.ruff.lint]
# Deliberately conservative for Sprint 0 (infra only, no engine code to
# tune rules against yet). Widen/tighten once real engine code exists.
select = ["E", "F", "W", "I"]

# --- Type checking ---------------------------------------------------------

[tool.mypy]
python_version = "3.12"
mypy_path = "."
packages = ["core", "adapters"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# --- Test runner ------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["core/tests"]
python_files = ["test_*.py"]
